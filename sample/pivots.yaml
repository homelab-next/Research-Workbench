kind: pivots
pivots:
  - id: address_to_internal_peers
    title: Hosts that connected to the address
    from: address
    to: address
    source: flows
    query: "select src as peer from flows where dst = {value} and ts >= {window.from} and ts < {window.to}"
    needs_window: true
    empty_means: not-seen
    yields: { peer: address }
  - id: address_to_domains
    title: Names that resolved to the address
    from: address
    to: domain
    source: dns-logs
    query: "select distinct name from dns where answer = {value} and ts >= {window.from} and ts < {window.to}"
    needs_window: true
    empty_means: not-seen
    yields: { name: domain }
  - id: domain_to_clients
    title: Clients that looked the name up
    from: domain
    to: address
    source: dns-logs
    query: "select distinct client from dns where name = {value} and ts >= {window.from} and ts < {window.to}"
    needs_window: true
    empty_means: not-seen
    yields: { client: address }
  - id: address_to_asset_by_lease
    title: Asset holding the address, by lease record
    from: address
    to: asset
    source: leases
    query: "select asset from leases where address = {value}"
    empty_means: not-seen
    yields: { asset: asset }
  - id: address_to_asset
    title: Asset with the address, by asset list
    from: address
    to: asset
    source: assets
    query: "select asset from assets where address = {value}"
    empty_means: proven-negative
    yields: { asset: asset }
  - id: asset_to_accounts
    title: Accounts that signed in to the asset
    from: asset
    to: account
    source: signins
    query: "select distinct account from signins where host = {value} and ts >= {window.from} and ts < {window.to}"
    needs_window: true
    empty_means: not-seen
    yields: { account: account }
  - id: account_to_signin_addresses
    title: Addresses the account signed in from
    from: account
    to: address
    source: signins
    query: "select distinct from_address from signins where account = {value} and ts >= {window.from} and ts < {window.to}"
    needs_window: true
    empty_means: not-seen
    yields: { from_address: address }
  - id: address_to_verdict
    title: Reputation verdict for the address
    from: address
    to: verdict
    source: reputation
    query: lookup
    empty_means: not-seen
    yields: { verdict: verdict }
