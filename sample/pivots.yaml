kind: pivots
pivots:
  - id: address_to_internal_peers
    title: Hosts that connected to the address
    from: address
    to: address
    source: flows
    query: "select src as peer, ts from flows where dst = {value} and ts >= {window.from} and ts < {window.to}"
    needs_window: true
    empty_means: not-seen
    yields: { peer: address }
    times: { at: ts }
  - id: address_to_domains
    title: Names that resolved to the address
    from: address
    to: domain
    source: dns-logs
    query: "select name, min(ts) as first_seen, max(ts) as last_seen, count(*) as events from dns where answer = {value} and ts >= {window.from} and ts < {window.to} group by name order by first_seen, name"
    needs_window: true
    empty_means: not-seen
    yields: { name: domain }
    times: { first: first_seen, last: last_seen, count: events }
  - id: domain_to_clients
    title: Clients that looked the name up
    from: domain
    to: address
    source: dns-logs
    query: "select client, min(ts) as first_seen, max(ts) as last_seen, count(*) as events from dns where name = {value} and ts >= {window.from} and ts < {window.to} group by client order by first_seen, client"
    needs_window: true
    empty_means: not-seen
    yields: { client: address }
    times: { first: first_seen, last: last_seen, count: events }
  - id: address_to_asset_by_lease
    title: Asset holding the address, by lease record
    from: address
    to: asset
    source: leases
    query: "select asset from leases where address = {value}"
    inventory: leases
    empty_means: not-seen
    yields: { asset: asset }
  - id: address_to_asset
    title: Asset with the address, by asset list
    from: address
    to: asset
    source: assets
    query: "select asset from assets where address = {value}"
    inventory: assets
    empty_means: proven-negative
    yields: { asset: asset }
  - id: asset_to_accounts
    title: Accounts that signed in to the asset
    from: asset
    to: account
    source: signins
    query: "select account, min(ts) as first_seen, max(ts) as last_seen, count(*) as events from signins where host = {value} and ts >= {window.from} and ts < {window.to} group by account order by first_seen, account"
    needs_window: true
    empty_means: not-seen
    yields: { account: account }
    times: { first: first_seen, last: last_seen, count: events }
  - id: account_to_signin_addresses
    title: Addresses the account signed in from
    from: account
    to: address
    source: signins
    query: "select from_address, min(ts) as first_seen, max(ts) as last_seen, count(*) as events from signins where account = {value} and ts >= {window.from} and ts < {window.to} group by from_address order by first_seen, from_address"
    needs_window: true
    empty_means: not-seen
    yields: { from_address: address }
    times: { first: first_seen, last: last_seen, count: events }
  - id: address_to_verdict
    title: Reputation verdict for the address
    from: address
    to: verdict
    source: reputation
    query: lookup
    empty_means: not-seen
    yields: { verdict: verdict }
  - id: address_to_wifi
    title: WiFi messages for the address
    answers: Which device held the address on the wireless network, and which access point it joined.
    from: address
    to: host
    source: wifi
    query: "select ts, ap, message from wifi where address = {value} and ts >= {window.from} and ts < {window.to} order by ts"
    needs_window: true
    empty_means: not-seen
    yields: { ap: host }
    times: { at: ts }
