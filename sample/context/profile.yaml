kind: profile
id: investigation
title: Investigation
rules: base-rules
framework: intel-cycle
standard: icd203
stages:
  frame:
    agent: orchestrator
    persona: orchestrator
    goal: Turn the question into goals, a time window and limits on how far to reach.
  plan:
    agent: planner
    persona: planner
    goal: Break each goal into sub-goals and choose a route of pivots for each.
  research:
    agent: researcher
    persona: researcher
    goal: Run the accepted steps, collect what each returns and say what was not found.
    procedure: research-sop
  assemble:
    agent: analyst
    persona: analyst
    goal: Write the findings from the cards, with likelihood and confidence, and name the gaps.
    procedure: assemble-sop
  evaluate:
    agent: evaluator
    persona: evaluator
    goal: Check the draft against its cards and report what does not hold.
  challenge:
    agent: adversary
    persona: adversary
    goal: Argue against the draft and raise the objections that must be answered.
  publish:
    agent: publisher
    persona: publisher
    goal: Give the reviewed product a title and a short note for its bundle.
